{% extends "base.html" %}
{% block content %}

<div class="pt-24 text-center text-white">

<h2 class="text-3xl font-bold mb-6">
Now Streaming — {{ movie }}
</h2>

<div class="flex justify-center">
    <iframe width="900" height="500"
        src="{{ video }}"
        frameborder="0"
        allowfullscreen>
    </iframe>
</div>

<p class="mt-4 text-gray-400">
Access valid till: {{ expires }}
</p>

</div>

{% endblock %}
