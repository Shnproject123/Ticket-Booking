<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Payment</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.loader{
  border:6px solid #f3f3f3;
  border-top:6px solid #ef4444;
  border-radius:50%;
  width:50px;
  height:50px;
  animation:spin 1s linear infinite;
  margin:20px auto;
}
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
</style>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-md mx-auto bg-white p-6 rounded shadow text-center">
  <h1 class="text-2xl font-bold mb-2">Processing Payment...</h1>
  <div class="loader"></div>

  <p class="text-gray-700 mt-2">
    Movie: <span id="movie"></span>
  </p>
  <p class="text-gray-700">
    Plan: <span id="plan"></span>
  </p>
  <p class="text-gray-700">
    Amount: ₹<span id="amount"></span>
  </p>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const movie  = params.get("movie") || "Movie";
const plan   = params.get("plan") || "rent";
const amount = params.get("amount") || "0";
const type   = params.get("type") || "stream";

document.getElementById("movie").innerText = movie;
document.getElementById("plan").innerText = plan.toUpperCase();
document.getElementById("amount").innerText = amount;

let redirectPage = "player.html";
if(type === "ticket"){
  redirectPage = "booking-confirmation.html";
}

setTimeout(()=>{
  window.location.href = redirectPage + "?" + params.toString();
},2500);
</script>

</body>
</html>
