<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Movie</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-4">

<h2 class="text-2xl mb-4" id="movieTitle"></h2>

<video controls class="w-full max-w-4xl rounded-lg">
  <source src="sample.mp4" type="video/mp4">
  Your browser does not support video.
</video>

<script>
const params = new URLSearchParams(window.location.search);
const movie = params.get("movie") || "Movie Title";
const plan = params.get("plan") || "rent";

document.getElementById("movieTitle").innerText = `Now Playing: ${movie} (${plan.toUpperCase()})`;
</script>

</body>
</html>
