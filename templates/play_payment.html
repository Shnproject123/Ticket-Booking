{% extends "base.html" %}
{% load static %}

{% block title %}Play Payment | BookMyScreen{% endblock %}

{% block content %}

<section class="flex justify-center items-start min-h-screen bg-gradient-to-b from-white via-gray-50 to-white pt-32 pb-16">
    <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8">

        <!-- PLAY TITLE -->
        <h2 class="text-3xl font-bold text-center mb-2 text-gray-800">{{ play }}</h2>
        <p class="text-gray-500 text-center mb-6">Complete your booking</p>

        <!-- PRICE SUMMARY -->
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl mb-6 shadow text-gray-700 font-semibold text-lg">
            <span>Tickets: <span id="ticketCount">1</span></span>
            <span>Total: ₹<span id="totalPrice">{{ price }}</span></span>
        </div>

        <!-- TICKET COUNTER -->
        <div class="flex justify-center items-center gap-6 mb-6">
            <button onclick="decrease()" 
                    class="w-12 h-12 rounded-full bg-gray-200 hover:bg-gray-300 text-2xl font-bold transition-shadow shadow-sm">−</button>
            <span id="ticketDisplay" 
                  class="px-6 py-3 bg-gray-100 rounded-full font-semibold text-lg shadow-inner">{{ qty|default:1 }}</span>
            <button onclick="increase()" 
                    class="w-12 h-12 rounded-full bg-gray-200 hover:bg-gray-300 text-2xl font-bold transition-shadow shadow-sm">+</button>
        </div>

        <!-- PAYMENT METHODS -->
        <h3 class="font-semibold text-gray-700 mb-3">Payment Method</h3>
        <div class="flex justify-between items-center gap-3 mb-6">

            <label class="payment-option flex-1 flex flex-col items-center p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-yellow-50 transition shadow">
                <input type="radio" name="payment" checked class="hidden">
                <img src="{% static 'assets/images/google.jpg' %}" class="h-10 mb-1">
                <span class="text-sm font-medium text-gray-700">Google Pay</span>
            </label>

            <label class="payment-option flex-1 flex flex-col items-center p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-yellow-50 transition shadow">
                <input type="radio" name="payment" class="hidden">
                <img src="{% static 'assets/images/phonepe.png' %}" class="h-10 mb-1">
                <span class="text-sm font-medium text-gray-700">PhonePe</span>
            </label>

            <label class="payment-option flex-1 flex flex-col items-center p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-yellow-50 transition shadow">
                <input type="radio" name="payment" class="hidden">
                <img src="{% static 'assets/images/paytm.png' %}" class="h-10 mb-1">
                <span class="text-sm font-medium text-gray-700">Paytm</span>
            </label>

            <label class="payment-option flex-1 flex flex-col items-center p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-yellow-50 transition shadow">
                <input type="radio" name="payment" class="hidden">
                <img src="{% static 'assets/images/payments/card.png' %}" class="h-10 mb-1">
                <span class="text-sm font-medium text-gray-700">Card</span>
            </label>

        </div>

        <!-- PAY BUTTON -->
        <button onclick="processPayment()" 
                class="w-full bg-yellow-400 text-black py-3 rounded-xl font-semibold hover:bg-yellow-500 transition shadow-lg text-lg">
            Pay ₹<span id="payTotal">{{ price }}</span>
        </button>

    </div>
</section>

<script>
let qty = 1;
const pricePerTicket = {{ price }};

function increase() { qty++; update(); }
function decrease() { if(qty > 1){ qty--; update(); } }

function update() {
    const total = qty * pricePerTicket;
    document.getElementById("ticketDisplay").innerText = qty;
    document.getElementById("ticketCount").innerText = qty;
    document.getElementById("totalPrice").innerText = total;
    document.getElementById("payTotal").innerText = total;
}

// Highlight selected payment
const options = document.querySelectorAll('.payment-option');
options.forEach(opt => {
    opt.addEventListener('click', () => {
        options.forEach(o => o.classList.remove('bg-yellow-50', 'shadow-xl'));
        opt.classList.add('bg-yellow-50', 'shadow-xl');
        opt.querySelector('input').checked = true;
    });
});

function processPayment() {
    document.body.innerHTML = `
        <div class="flex flex-col items-center justify-center h-screen bg-white">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-yellow-400 mb-4"></div>
            <p class="text-lg font-semibold text-gray-800">Processing Payment...</p>
        </div>
    `;
    setTimeout(() => {
        window.location.href = "{% url 'play_payment_success' %}";
    }, 2000);
}
</script>

{% endblock %}
