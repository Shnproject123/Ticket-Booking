{% comment %} {% include 'includes/header.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>

  <!-- Animation + UI styles -->
  <link rel="stylesheet" href="register.css">
  <style>
    /* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

/* PAGE BACKGROUND */
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* WRAPPER */
.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}



/* ================= CARD ================= */
.card {
  background: #fff;
  width: 320px;
  padding: 25px 22px;
  border-radius: 14px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* FORM FIELDS */
.field {
  margin-bottom: 14px;
}

.field input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  outline: none;
  font-size: 14px;
}

.field input:focus {
  border-color: #6366f1;
}

/* BUTTON */
.field button {
  width: 100%;
  padding: 11px;
  background: #4f46e5;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s ease;
}

.field button:hover {
  background: #4338ca;
}

/* MUTED TEXT */
.muted {
  text-align: center;
  font-size: 13px;
  color: #6b7280;
}

/* OTP SECTION */
#otpSection {
  margin-top: 10px;
}

  </style>

  <!-- EmailJS CDN (MUST be before register.js) -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>

<body>

<div class="wrap">

 
  <!-- ================= REGISTER CARD ================= -->
  <div class="card">

    <h2 style="margin-bottom:16px">Register</h2>

    <div class="field">
      <input id="name" type="text" placeholder="Name">
    </div>

    <div class="field">
      <input id="email" type="email" placeholder="Email">
    </div>

    <div class="field">
      <input id="password" type="password" placeholder="Password">
    </div>

    <div class="field">
      <input id="confirmPassword" type="password" placeholder="Confirm Password">
    </div>

    <div class="field">
      <button id="sendOtpBtn">Send OTP</button>
    </div>

    <!-- OTP SECTION (HIDDEN INITIALLY) -->
    <div id="otpSection" style="display:none;">

      <div class="field">
        <input id="otp" type="text" placeholder="Enter OTP">
      </div>

      <div class="field">
        <button onclick="verifyOTP()">Verify OTP</button>
      </div>

    </div>

    <div class="muted" style="margin-top:12px;">
      Already registered?
      <a href="login.html" style="color:#2563eb;font-weight:600">Login</a>
    </div>

  </div>

</div>

<script src="animation.js"></script>
<script src="register 1.js"></script>

</body>
</html> {% endcomment %}
