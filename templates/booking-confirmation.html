<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 p-6">

<div class="max-w-md mx-auto bg-white p-6 rounded shadow text-center">

<h1 class="text-2xl font-bold text-green-600 mb-2">🎉 Booking Confirmed!</h1>

<p>Movie: <span id="movie"></span></p>
<p>Seats: <span id="seats"></span></p>
<p>Amount: ₹<span id="amount"></span></p>

<a href="movies.html"
 class="mt-4 inline-block bg-red-600 text-white px-6 py-2 rounded">
Back to Movies
</a>

</div>

<script>
const p = new URLSearchParams(window.location.search);
document.getElementById("movie").innerText = p.get("movie");
document.getElementById("seats").innerText = p.get("seats");
document.getElementById("amount").innerText = p.get("amount");
</script>

</body>
</html>
