
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Event Ticket</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-md text-center space-y-4">

  <h2 class="text-2xl font-bold text-red-600">🎟️ Event Ticket</h2>

  <p><b>Event:</b> {{ name }}</p>
  <p><b>Tickets:</b> {{ qty }}</p>
  <p><b>Total Paid:</b> ₹{{ total }}</p>

  <div class="flex justify-center mt-4">
    <img src="data:image/png;base64,{{ qr_code }}" class="h-40 w-40">
  </div>

  <p class="text-gray-500 text-sm mt-2">
    Show this QR code at venue entry
  </p>

  <a href="{% url 'events' %}"
     class="mt-4 inline-block bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700">
     Back to Events
  </a>

</div>

</body>
</html>
