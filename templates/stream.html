{% extends 'base.html' %}
{% load static %}

{% block title %}Stream | BookMyScreen{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row max-w-7xl mx-auto mt-6 px-4 gap-6">

  <!-- ================= MOVIES GRID ================= -->
  <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for movie in stream_movies %}
    <div class="movie-card relative bg-white rounded shadow hover:scale-105 transition overflow-hidden"
         data-language="{{ movie.language }}"
         data-genre="{{ movie.genre }}"
         data-price="{{ movie.price }}">

      <!-- IMAGE -->
      <img src="{% static movie.image %}" class="rounded-t w-full h-48 object-cover" alt="{{ movie.title }}"
           onerror="this.src='{% static 'assets/images/movies/default.avif' %}'">

      <!-- CARD CONTENT -->
      <div class="p-2">
        <p class="font-semibold text-lg">{{ movie.title }}</p>
        <p class="text-sm text-gray-500 mb-1">{{ movie.language }} | {{ movie.genre }}</p>
        <p class="text-red-600 font-bold mt-1">Rent ₹{{ movie.price }}</p>
      </div>

      <!-- HOVER OVERLAY -->
      <div class="absolute inset-0 bg-black bg-opacity-70 opacity-0 hover:opacity-100 transition flex flex-col items-center justify-center text-white p-4 text-center">
        <p class="mb-2">{{ movie.desc }}</p>
        <!-- PAY & WATCH BUTTON -->
        <form action="{% url 'stream_payment' %}" method="get">
          <input type="hidden" name="movie" value="{{ movie.title }}">
          <input type="hidden" name="price" value="{{ movie.price }}">
          <button type="submit" class="bg-yellow-500 hover:bg-yellow-600 py-1 px-3 rounded font-semibold">
            Pay & Watch
          </button>
        </form>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- ================= FILTERS RIGHT SIDE ================= -->
  <div class="w-full md:w-64 bg-white shadow rounded-lg p-4 sticky top-20 h-fit">
    <h2 class="text-xl font-bold mb-4">Filter Movies</h2>

    <!-- LANGUAGE FILTER -->
    <div class="mb-4">
      <label class="block mb-1 font-medium">Language</label>
      <select id="languageFilter" class="border p-2 rounded w-full">
        <option value="">All Languages</option>
        {% for lang in languages %}
        <option value="{{ lang }}">{{ lang }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- GENRE FILTER -->
    <div class="mb-4">
      <label class="block mb-1 font-medium">Genre</label>
      <select id="genreFilter" class="border p-2 rounded w-full">
        <option value="">All Genres</option>
        {% for g in genres %}
        <option value="{{ g }}">{{ g }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- PRICE FILTER -->
    <div class="mb-4">
      <label class="block mb-1 font-medium">Price</label>
      <select id="priceFilter" class="border p-2 rounded w-full">
        <option value="">All Prices</option>
        <option value="99">₹99</option>
        <option value="149">₹149</option>
        <option value="199">₹199</option>
      </select>
    </div>

    <button onclick="resetFilters()" class="bg-red-600 text-white w-full py-2 rounded font-semibold hover:bg-red-700">
      Reset Filters
    </button>
  </div>
</div>

<!-- ================= JS FILTER ================= -->
<script>
const languageFilter = document.getElementById('languageFilter');
const genreFilter = document.getElementById('genreFilter');
const priceFilter = document.getElementById('priceFilter');
const movieCards = Array.from(document.getElementsByClassName('movie-card'));

function filterMovies() {
  const language = languageFilter.value;
  const genre = genreFilter.value;
  const price = priceFilter.value;

  movieCards.forEach(card => {
    const cardLanguage = card.dataset.language;
    const cardGenre = card.dataset.genre;
    const cardPrice = card.dataset.price;

    if ((language === "" || cardLanguage === language) &&
        (genre === "" || cardGenre === genre) &&
        (price === "" || cardPrice === price)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}

function resetFilters() {
  languageFilter.value = "";
  genreFilter.value = "";
  priceFilter.value = "";
  filterMovies();
}

languageFilter.addEventListener('change', filterMovies);
genreFilter.addEventListener('change', filterMovies);
priceFilter.addEventListener('change', filterMovies);
</script>
{% endblock %}
